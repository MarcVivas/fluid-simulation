[profile.dev]
opt-level = 1

[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
ash = "0.38.0"
ash-window = "0.13.0"
winit = "0.30.12"
gpu-allocator = "0.28.0"
glam = { version = "0.30.9", features = ["bytemuck"] }
rand = "0.9.2"
bytemuck = { version = "1.24.0", features = ["derive", "min_const_generics"] }
rayon = "1.11.0"
shader-slang = "0.1.0"
criterion = "0.8.2"


[build-dependencies]
shader-slang = "0.1.0"

[[bench]]
name = "gpu_bench_main" 
harness = false
